name: Sync Public and Deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    if: github.repository == 'alimuratumutlu/muum-repo-explorer'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private deploy repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync from public repo
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          before="$(git rev-parse HEAD)"
          git remote add public https://github.com/muratumutlu/muum-repo-explorer.git
          git fetch public master
          git merge --ff-only public/master
          after="$(git rev-parse HEAD)"

          if [ "$before" != "$after" ]; then
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Private deploy repo synced to $after."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Private deploy repo already matches public master."
          fi

      - name: Setup Node.js
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Run test suite
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm test

      - name: Build static site
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build:web

      - name: Ensure Cloudflare Pages project exists
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npx wrangler pages project create muum-repo-explorer --production-branch master || \
            echo "Cloudflare Pages project may already exist; continuing to deploy."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler pages deploy out --project-name muum-repo-explorer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
