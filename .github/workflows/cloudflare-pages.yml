name: Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build static site
        run: npm run build:web

      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create muum-repo-explorer --production-branch master || \
            echo "Cloudflare Pages project may already exist; continuing to deploy."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name muum-repo-explorer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach custom domain
        run: |
          response="$(curl --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/muum-repo-explorer/domains" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data '{"name":"muum.dev"}')"

          echo "$response" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              const messages = [...(payload.errors || []), ...(payload.messages || [])]
                .map((item) => item.message || "")
                .join("\n");

              if (payload.success || /already|exists/i.test(messages)) {
                console.log("Custom domain muum.dev is attached or already exists.");
                return;
              }

              console.error(JSON.stringify(payload, null, 2));
              process.exit(1);
            });
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
